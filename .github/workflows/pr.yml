name: PR

on:
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group permits pr-trusted.yml@refs/heads/master.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master
